# Arranque completo con MariaDB:  docker compose up -d   → http://localhost:3000
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: erp
      MARIADB_USER: erp
      MARIADB_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cambia_esta_clave_root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave}
      DB_CREATE: "0"
      APP_SECRET: ${APP_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data   # contiene secret.key si no se define APP_SECRET

volumes:
  db_data:
  app_data:
